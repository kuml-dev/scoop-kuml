name: Update manifest

# Keeps bucket/kuml.json on the latest kUML release. Runs every six hours and
# on demand; commits only when the manifest changed.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Update manifest
        run: scripts/update-manifest.sh

      - name: Commit and push
        run: |
          if git diff --quiet -- bucket/kuml.json; then
            echo "Manifest is current."
            exit 0
          fi
          version="$(jq -r .version bucket/kuml.json)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/kuml.json
          git commit -m "kuml: update to ${version}"
          git push
