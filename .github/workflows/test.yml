name: Test install

# Installs kuml with Scoop on a clean Windows runner from the checked-out
# bucket and runs the launchers. Runs on every change to the manifest and on
# demand.
on:
  push:
    paths:
      - "bucket/**"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "bucket/**"
  workflow_dispatch:

jobs:
  install:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Scoop
        shell: pwsh
        run: |
          Invoke-RestMethod -Uri https://get.scoop.sh -OutFile install-scoop.ps1
          ./install-scoop.ps1 -RunAsAdmin
          "$HOME\scoop\shims" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install kuml from the manifest file of this checkout
        shell: pwsh
        run: |
          scoop install "$env:GITHUB_WORKSPACE\bucket\kuml.json"
          scoop list

      - name: Run the launchers
        shell: pwsh
        run: |
          kuml --version
          foreach ($cmd in 'kuml', 'kuml-mcp', 'kuml-lsp') {
            $found = Get-Command $cmd -ErrorAction SilentlyContinue
            if (-not $found) { throw "$cmd is not on PATH" }
            Write-Host "$cmd -> $($found.Source)"
          }

      - name: Uninstall
        shell: pwsh
        run: |
          scoop uninstall kuml
          if (Get-Command kuml -ErrorAction SilentlyContinue) { throw "kuml is still on PATH" }

      # The published bucket (default branch on GitHub). Pull requests cannot
      # test this, their change is not on the default branch yet.
      - name: Install kuml from the published bucket
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          scoop bucket add kuml https://github.com/kuml-dev/scoop-kuml
          scoop install kuml/kuml
          kuml --version
          scoop uninstall kuml
